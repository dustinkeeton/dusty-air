# Copy this file to secrets.yaml and fill in the values.
# secrets.yaml is git-ignored -- never commit it.
#
#   cp firmware/secrets.example.yaml firmware/secrets.yaml

# --- Wi-Fi -------------------------------------------------------------
# The ESP32 is 2.4 GHz only. A 5 GHz-only SSID will not connect.
wifi_ssid: "your-wifi-ssid"
wifi_password: ""

# Password for the "Dusty Air Fallback" hotspot the device raises if it
# cannot join your Wi-Fi. Must be at least 8 characters.
fallback_password: ""

# --- Home Assistant native API ----------------------------------------
# Pre-shared key for the encrypted ESPHome API. Generate one with:
#   openssl rand -base64 32
# You paste this same key into Home Assistant when it discovers the device.
api_key: ""

# --- OTA ---------------------------------------------------------------
# Password required for over-the-air firmware updates.
ota_password: ""

# --- MQTT (optional, retired) -----------------------------------------
# Only needed if you uncomment the `mqtt:` block in dusty-air.yaml.
# See the comments there before re-enabling it.
# mqtt_broker: "192.168.1.10"     # LAN IP of the broker, not a hostname
# mqtt_username: "dusty-air"
# mqtt_password: ""
